[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "train-tokens"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "trl>=0.8.6",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantize = ["bitsandbytes>=0.43.0"]
lora    = ["peft>=0.11.0"]
dev     = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
train-tokens = "train_tokens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/train_tokens"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
markers    = ["slow: requires model download (deselect with -m 'not slow')"]
