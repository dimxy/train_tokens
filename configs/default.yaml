model:
  # model_id: Qwen/Qwen2-0.5B
  model_id: Qwen/Qwen2-7B-Instruct
  dtype: bfloat16
  load_in_4bit: false
  load_in_8bit: false

tokens:
  num_tokens: 1
  token_prefix: ""   # token name is "<|{prefix}{label}|>" — empty prefix gives "<|humorous|>"
  init_strategy: mean   # mean | random | clone_eos

dataset:
  paths:                      # one JSONL (or HF dataset id) per split — required for honest held-out eval
    train: data/train.jsonl
    validation: data/validation.jsonl
    test: data/test.jsonl
  messages_column: messages   # each row is {"messages": [{"role": ..., "content": ...}, ...]}
  max_length: 2048

training:
  output_dir: outputs/run_01
  num_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.001
  lr_scheduler: cosine
  warmup_ratio: 0.1
  eval_strategy: steps
  eval_steps: 100
  save_steps: 100
  logging_steps: 10
  seed: 42
  bf16: true
  gradient_checkpointing: true
  report_to: none   # set to "wandb" to enable Weights & Biases logging

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  do_sample: true
